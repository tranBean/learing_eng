<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="242"/>
    </clipPath>
  </defs>

  <!-- Outer background (light blue-gray, visible at corners) -->
  <circle cx="256" cy="256" r="256" fill="#EDF4FA"/>

  <!-- Top section: dark navy -->
  <rect x="0" y="0" width="512" height="220" fill="#1B3A6B" clip-path="url(#circle-clip)"/>

  <!-- Middle section: powder blue -->
  <rect x="0" y="220" width="512" height="145" fill="#A8D4E6" clip-path="url(#circle-clip)"/>

  <!-- Bottom section: white -->
  <rect x="0" y="365" width="512" height="147" fill="#ffffff" clip-path="url(#circle-clip)"/>

  <!-- Subtle circle border -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="#C8DFF0" stroke-width="3"/>

  <!-- Top text: IELTS (bold white) -->
  <text x="256" y="140" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="80" fill="#ffffff" text-anchor="middle" letter-spacing="-1">IELTS</text>

  <!-- Middle text: learning -->
  <text x="256" y="313" font-family="Arial,sans-serif" font-weight="700" font-size="62" fill="#1B3A6B" text-anchor="middle">learning</text>

  <!-- Bottom text: english -->
  <text x="256" y="434" font-family="Arial,sans-serif" font-weight="600" font-size="52" fill="#1B3A6B" text-anchor="middle">english</text>
</svg>
